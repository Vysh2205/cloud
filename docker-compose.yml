version: '3.8'

services:
  # =====================================================================
  # 1. PostgreSQL Database Service
  # =====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: cloudbackup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_backup_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_backup_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_network

  # =====================================================================
  # 2. Local S3-Compatible Cloud Storage (MinIO)
  # =====================================================================
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: cloudbackup_s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # S3 Web Console Dashboard
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud_network

  # Helper container to configure initial S3 bucket and object versioning
  create-buckets:
    image: minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: cloudbackup_s3_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/distributed-cloud-backups;
      /usr/bin/mc version enable local/distributed-cloud-backups;
      echo 'S3 Bucket distributed-cloud-backups initialized with versioning enabled!';
      exit 0;
      "
    networks:
      - cloud_network

  # =====================================================================
  # 3. Distributed Cloud Backup Backend (Spring Boot 3 + Java 17)
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbackup_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud_backup_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-distributed-cloud-backups}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_S3_PATH_STYLE_ACCESS: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: 86400000
      RETRY_MAX_ATTEMPTS: 3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 4
    networks:
      - cloud_network

  # =====================================================================
  # 4. React Dashboard Frontend (Vite + Nginx)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbackup_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cloud_network

networks:
  cloud_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
