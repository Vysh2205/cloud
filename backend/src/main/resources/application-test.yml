spring:
  datasource:
    url: jdbc:h2:mem:cloudbackup_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

cloud:
  backup:
    s3:
      bucket-name: test-backup-bucket
      endpoint: http://localhost:9000
      auto-create-bucket: false
